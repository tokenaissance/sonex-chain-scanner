syntax = "proto3";

package scanner;

option go_package = "./pb"; 

message EmptyReq {}
message EmptyRes {}

message ChainScannerMetaRes {
    int64 chain_id = 1;
    int64 height = 2;
    int64 updated_at = 3;
}

message ChainScannerReplayReq {
    int64 start = 1;
    optional int64 end = 2;
}

service ChainScannerService {
    rpc Meta (EmptyReq) returns (ChainScannerMetaRes);
    rpc Replay (ChainScannerReplayReq) returns (EmptyRes);
}